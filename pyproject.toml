[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-computational-biology-genetic-matching"
version = "1.0.0"
description = "Genetic algorithm for two-sided preference matching"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
    { name = "Daniel Ben Zion" },
]
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pygad==3.3.1",
]

[project.scripts]
genetic-matching = "genetic_matching.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.setuptools]
packages = ["genetic_matching"]
package-dir = { genetic_matching = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["genetic_matching"]
