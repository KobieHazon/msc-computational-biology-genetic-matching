[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msc-computational-biology-genetic-matching"
version = "1.0.0"
description = "Genetic algorithm for two-sided preference matching"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
    { name = "Daniel Ben Zion" },
]
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pygad==3.3.1",
]

[project.scripts]
genetic-matching = "genetic_matching.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
